name: TestFlight

# Adapted from Adjutant's, which already ships through this exact path. Everything
# here is reused: the same Apple team, the same App Store Connect key, the same match
# repository and password, the same six GitHub secrets. Only the bundle id and two
# paths differ.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog for TestFlight'
        required: false
        default: 'New build from CI'

concurrency:
  # Two uploads racing for the same build number is a rejected upload and a confusing
  # afternoon.
  group: testflight
  cancel-in-progress: false

jobs:
  check-version:
    name: Has the version changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      # macOS runner minutes bill at 10x, and a full Release build plus a signing
      # round-trip plus an upload is the expensive part of this repository's CI. A
      # TestFlight build per commit is not worth that; a build per version bump is.
      #
      # The iOS test workflow deliberately does NOT share this gate — see ios.yml.
      # **Ask whether this build has ever been uploaded — not whether it differs from
      # one arbitrary neighbouring commit.**
      #
      # This gate used to diff `MARKETING_VERSION` against `HEAD~1`, and it silently
      # dropped a release. Build 17 carried the fix for a bug the Commander was
      # actively hitting; the bump landed in one commit and reached `main` inside a
      # merge, so `HEAD~1` was the branch being merged — which already had 0.9.6.
      # Current equalled previous, the job reported success, and **nothing shipped.**
      # Every check was green and no build existed.
      #
      # `HEAD~1` is not a meaningful question. It is a different commit depending on
      # whether the tip is a merge, a squash, a revert or a rebase, and on which side
      # of a merge git happens to call the first parent. The question actually worth
      # answering has one true answer: *is this build number already on TestFlight?*
      #
      # A tag pushed after a successful upload records exactly that, and it is immune
      # to merges, re-runs, reordering and to a second agent committing in between.
      # It also fails SAFE in the direction that matters: an upload whose tag push
      # fails gets retried and rejected by App Store Connect as a duplicate build,
      # which is noisy and harmless. The old gate failed silent, which is neither.
      - name: Has this build already been uploaded?
        if: github.event_name == 'push'
        id: diff
        run: |
          # Every occurrence, sorted and deduplicated, not just the first. Debug and
          # Release each carry one, and `head -1` reads whichever configuration happens
          # to appear first in the pbxproj — which changes when Xcode rewrites the file.
          extract() { grep "$1" | sed 's/.*= *//;s/;.*//' | sort -u | tr -d '\n '; }
          VERSION=$(extract MARKETING_VERSION < ios/Syl.xcodeproj/project.pbxproj)
          BUILD=$(extract CURRENT_PROJECT_VERSION < ios/Syl.xcodeproj/project.pbxproj)
          echo "version=$VERSION build=$BUILD"

          if [ -z "$BUILD" ]; then
            echo "::error::Could not read CURRENT_PROJECT_VERSION from the project."
            exit 1
          fi

          # The build number is the identity App Store Connect enforces uniqueness on,
          # so it is what the tag is named for.
          if git ls-remote --exit-code --tags origin "refs/tags/testflight/$BUILD" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Build $BUILD ($VERSION) is already on TestFlight — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Build $BUILD ($VERSION) has never been uploaded — shipping it."
          fi

  deploy:
    name: Build and upload
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    # macos-26 is REQUIRED, not preferred. Older runners build against an SDK that
    # App Store Connect rejects with a 409 — and it rejects it *after* a successful
    # build and a successful sign, so the failure arrives at the end of the slowest
    # step in the pipeline with nothing before it having complained.
    runs-on: macos-26

    # For the `testflight/<build>` tag, and for nothing else. The default token is
    # read-only, and the tag push failed `403` on the first real run — *after* a
    # successful upload, which is the whole design working: the gate now fails toward
    # a duplicate upload App Store Connect will reject loudly, never toward silence.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ios

    env:
      APP_IDENTIFIER: com.jmm.syl
      TEAM_ID: 2BRYAM5Q52

    steps:
      - uses: actions/checkout@v4

      # `bundler-cache: true` installs from the COMMITTED Gemfile.lock. Do not
      # regenerate that lockfile: without `arm64-darwin` in its PLATFORMS section,
      # bundler fails about 25 seconds in — before Swift compiles anything, and with
      # an error that says nothing about the architecture.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      # Node, because the suite below is not only Swift.
      #
      # `ios/scripts/test.sh` has three phases, and its middle one boots a REAL
      # throwaway Syl service so `LiveServerTests` can drive `APIClient` against
      # it rather than a mock. That phase needs the backend's dependencies.
      #
      # Missing here, this job failed with "node_modules is missing" AFTER
      # compiling and running all 210 Swift tests — a minute of macOS runner time,
      # which bills at 10x, spent to discover a setup step. `ios.yml` already had
      # these two steps; this workflow was assembled without them because its
      # author was thinking about signing, not about what the test script needs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run both halves of the test suite
        # Before signing anything. A build that ships untested is worse than one that
        # does not ship, and this is the last point at which stopping is cheap.
        run: scripts/test.sh

      - name: Write the App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          mkdir -p fastlane
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > fastlane/AuthKey.p8
          KEY_CONTENT=$(awk 'NF {sub(/\r/, ""); printf "%s\\n",$0;}' fastlane/AuthKey.p8)
          printf '{"key_id":"%s","issuer_id":"%s","key":"%s","in_house":false}' \
            "$APP_STORE_CONNECT_API_KEY_ID" "$APP_STORE_CONNECT_API_ISSUER_ID" "$KEY_CONTENT" \
            > fastlane/api_key.json

      - name: Configure fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # Through `env`, never interpolated into the script body. `changelog` is
          # attacker-controlled on `workflow_dispatch`, and this runner is holding a
          # decoded App Store Connect key and the match password — a `${{ }}` splice
          # into a shell command is a remote code execution with those in reach.
          CHANGELOG_INPUT: ${{ github.event.inputs.changelog || 'CI build from commit' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' \
            "APP_STORE_CONNECT_API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" \
            "APP_STORE_CONNECT_API_ISSUER_ID=$APP_STORE_CONNECT_API_ISSUER_ID" \
            "APP_STORE_CONNECT_API_KEY_PATH=./fastlane/AuthKey.p8" \
            "APP_IDENTIFIER=$APP_IDENTIFIER" \
            "TEAM_ID=$TEAM_ID" \
            "MATCH_GIT_URL=$MATCH_GIT_URL" \
            "MATCH_PASSWORD=$MATCH_PASSWORD" \
            "CHANGELOG=$CHANGELOG_INPUT $COMMIT_SHA" \
            > fastlane/.env

      - name: Setup SSH for match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta

      # **The record that this build shipped, and the thing the gate above reads.**
      #
      # After the upload, never before: a tag written first would mark a build that
      # failed to ship as shipped, which is the silent failure this whole change
      # exists to remove — in the one direction where it costs a release rather than
      # a duplicate-build rejection.
      #
      # `git tag` on the runner's checkout, pushed to origin. It is deliberately not
      # annotated: this is a machine-readable fact about what exists in App Store
      # Connect, not a milestone anybody reads.
      - name: Record that this build is on TestFlight
        working-directory: ${{ github.workspace }}
        run: |
          extract() { grep "$1" | sed 's/.*= *//;s/;.*//' | sort -u | tr -d '\n '; }
          BUILD=$(extract CURRENT_PROJECT_VERSION < ios/Syl.xcodeproj/project.pbxproj)
          git tag "testflight/$BUILD"
          git push origin "testflight/$BUILD"
          echo "Tagged build $BUILD as uploaded."

      - name: Remove the credentials
        # `always()`: a failed build must not leave a decoded signing key on the
        # runner's disk.
        if: always()
        run: |
          rm -f fastlane/AuthKey.p8
          rm -f fastlane/api_key.json
          rm -f fastlane/.env
