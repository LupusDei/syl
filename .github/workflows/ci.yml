name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .nvmrc is the single source of truth for the Node version. Node 22 is
      # required, not merely preferred: Node 20 is end-of-life and has no
      # node:sqlite, which the memory and job stores depend on.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards the shape of the repo, not the behaviour of the code: a
      # workspace that grows source without tests fails here.
      - name: Every workspace with source has tests
        run: node scripts/check-workspaces-tested.mjs

      - name: Typecheck (root + every workspace)
        run: npm run typecheck

      # The build is a gate, not a convenience. tsc emits JavaScript and copies
      # nothing else, so backend/scripts/copy-assets.mjs is the only thing that
      # puts the .sql migrations into dist/ — and it exits non-zero if it
      # copied none. Without this step that guard never runs, and a build that
      # silently lost its migrations reaches production intact.
      - name: Build (every workspace)
        run: npm run build

      # `test:gate`, NOT `npm test`. The repository's gate is "failures ==
      # declared" (tests/expected-failures.json), not "zero failures" — an
      # acceptance test for unbuilt behaviour stays RED on purpose. This step
      # ran `npm test` and so was red on EVERY commit to main from the moment
      # the manifest landed, while `npm run verify` was green locally. CI and
      # the repository disagreed about what green means, which is worse than
      # either definition.
      #
      # It also blocked the auto-deployer before it existed: the update job
      # deploys only CI-green commits, so it would have declined every commit
      # forever, silently — the exact failure class syl-dep1 exists to kill.
      #
      # ONE STEP, TWO PASSES. `test:gate` is `scripts/run-tests.mjs --gate`,
      # which runs the cheap majority and then the spawn-heavy files alone in a
      # second vitest process — the isolation that stopped six files timing out
      # under load. Deliberately not split into two CI steps: a step can be
      # deleted, and a gate that covers half the suite while looking green is
      # this project's signature defect. The script runs both, and the checker
      # fails if any test file on disk was run by neither.
      - name: Test (every workspace)
        run: npm run test:gate

      # Blocking. Thresholds live in vitest.shared.ts (80/70/60, constitution
      # rule 1) so no workspace can quietly lower its own bar. This step ran
      # report-only until syl-001.3.1 gave session.ts its first tests; do not
      # reintroduce continue-on-error, and do not lower the thresholds.
      - name: Coverage
        run: npm run test:coverage
