name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .nvmrc is the single source of truth for the Node version. Node 22 is
      # required, not merely preferred: Node 20 is end-of-life and has no
      # node:sqlite, which the memory and job stores depend on.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards the shape of the repo, not the behaviour of the code: a
      # workspace that grows source without tests fails here.
      - name: Every workspace with source has tests
        run: node scripts/check-workspaces-tested.mjs

      - name: Typecheck (root + every workspace)
        run: npm run typecheck

      # The build is a gate, not a convenience. tsc emits JavaScript and copies
      # nothing else, so backend/scripts/copy-assets.mjs is the only thing that
      # puts the .sql migrations into dist/ — and it exits non-zero if it
      # copied none. Without this step that guard never runs, and a build that
      # silently lost its migrations reaches production intact.
      - name: Build (every workspace)
        run: npm run build

      - name: Test (every workspace)
        run: npm test

      # Blocking. Thresholds live in vitest.shared.ts (80/70/60, constitution
      # rule 1) so no workspace can quietly lower its own bar. This step ran
      # report-only until syl-001.3.1 gave session.ts its first tests; do not
      # reintroduce continue-on-error, and do not lower the thresholds.
      - name: Coverage
        run: npm run test:coverage
