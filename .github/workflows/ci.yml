name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .nvmrc is the single source of truth for the Node version. Node 22 is
      # required, not merely preferred: Node 20 is end-of-life and has no
      # node:sqlite, which the memory and job stores depend on.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards the shape of the repo, not the behaviour of the code: a
      # workspace that grows source without tests fails here.
      - name: Every workspace with source has tests
        run: node scripts/check-workspaces-tested.mjs

      - name: Typecheck (root + every workspace)
        run: npm run typecheck

      - name: Test (every workspace)
        run: npm test

      # Not yet blocking. runTurn() in backend/src/harness/session.ts has no
      # unit tests at all, which holds the repo at ~72% lines against the
      # constitution's 80%. syl-001.3.1 adds them; flip this to a hard gate by
      # deleting continue-on-error once it lands.
      - name: Coverage (report only — see syl-001.3.1)
        run: npm run test:coverage
        continue-on-error: true
